name: zenaa

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zenaa
      POSTGRES_USER: zenaa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenaa -d zenaa"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the LAN — only the app container can reach it.

  app:
    build: .
    image: zenaa-gamehub:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zenaa:${POSTGRES_PASSWORD}@db:5432/zenaa
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BACKUP_DIR: /backups
      UPDATE_DIR: /updates
    volumes:
      # Backups (one-file .json.gz from the app + nightly database dumps). Point BACKUP_PATH in .env at a
      # Google Drive / OneDrive / Dropbox synced folder to copy every backup to the cloud automatically.
      - ${BACKUP_PATH:-./backups}:/backups
      # "Update now" requests for the updater on the PC (infra/updater).
      - ./updates:/updates
    ports:
      - "${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: zenaa
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: zenaa
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-UTC}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
      - ./infra/backup/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]

  # Phase 8 (smart plugs): uncomment to run the local MQTT broker for Tasmota devices.
  # mqtt:
  #   image: eclipse-mosquitto:2
  #   restart: unless-stopped
  #   ports: ["1883:1883"]
  #   volumes:
  #     - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  #     - mqttdata:/mosquitto/data

volumes:
  pgdata:
